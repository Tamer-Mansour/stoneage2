# StoneAge 2 - UI strings of the new (modern) interface, German (de_DE).
#
# This file is the shared APP LAYER: it is published and used by every build.
# It is loaded on top of the base layer (i18n/de_DE.properties, taken from
# assets/original/ for local builds or assets/public/ for public builds); keys here win.
#
# New keys: always use the `App.` prefix and add them HERE (app_de_DE, app_en_US and
# app_tr_TR.properties) - never to the base-layer files.
# Format: Java .properties, UTF-8, MessageFormat placeholders {0}, {1}, ...

